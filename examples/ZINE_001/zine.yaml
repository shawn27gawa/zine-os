zineos_version: "0.1"

project:
  id: "zine-001-our-memory"
  title: "Our Memory"
  description: "A 26-page zine about memory, place, photography, reflection, unfinished space, and future desire."
  language: "en"
  status: "draft"

metadata:
  creator: "Shunya Ninagawa"
  contributors: []
  edition: 1
  created: "2026-08-08"
  published: null
  tags:
    - memory
    - travel
    - photography
    - reflection
    - zine
    - personal
    - print

