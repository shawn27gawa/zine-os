        type: "PHOTO"
        asset: "photo-018"
    layout:
      type: "full-page"

  - id: "page-027"
    pages: [27]
    section: "future"
    blocks:
      - id: "block-039"
        type: "TEXT"
        content: |
          あの頃は、まだお互いに少し気を遣っていた。

          今は、お互い相手の考えていることが少しわかる。

          あの旅の頃よりも、心を通わせられるようになったと思う。

      - id: "block-030"
        type: "QUESTION"
        content: "WHERE DO YOU WANT TO GO?"
    layout:
      type: "question-page"
      settings:
        response_lines: 4

