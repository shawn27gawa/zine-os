    source: "assets/photo-004.jpg"
    title: "Gallery image 3"

  - id: "photo-005"
    type: "image"
    source: "assets/photo-005.jpg"
    title: "Gallery image 4"

  - id: "photo-006"
    type: "image"
    source: "assets/photo-006.jpeg"
    title: "Full spread image 1"

  - id: "bottle-001"
    type: "image"
    source: "assets/bottle-001.png"
