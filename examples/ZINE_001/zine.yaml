  - id: "spread-002-003"
    pages: [2, 3]
    section: "opening"
    blocks:
      - id: "block-041"
        type: "TEXT"
        content: "EUROPE 2024"

      - id: "block-042"
        type: "TEXT"
        content: "OUR MEMORY"

      - id: "block-043"
        type: "TEXT"
        content: "ROMA / VENEZIA / MÜNCHEN / BERN / AMSTERDAM / PARIS / BARCELONA / MADRID / LISBON"
    layout:
      type: "opening-breath-spread"

  - id: "spread-004-005"
    pages: [4, 5]
    section: "roma"
    blocks:
      - id: "block-005"
        type: "MAP"
        asset: "map-001"

      - id: "block-003"
        type: "PHOTO"
        asset: "photo-001"

      - id: "block-004"
        type: "CAPTION"
        content: |
          ROMA → VENEZIA → MÜNCHEN → BERN → AMSTERDAM → PARIS → BARCELONA → MADRID → LISBON

      - id: "block-035"
        type: "TEXT"
        content: |
          すごく暑かった。
          でも、どこを見てもきれいだった。

          ローマを歩いていると、ヨーロッパの長い時間に、そのまま飲み込まれていく
          みたいな感覚だった。

          コロッセオでは、昔ここで何千、何万もの人が、ひとつのことに熱中していたのだと思うと意外と今も昔も変わらないのかもしれないと思った。

          遠い時代の人たちと、少しだけつながれた気がした。
    layout:
      type: "trace-map-spread"

  - id: "spread-006-007"
    pages: [6, 7]
    section: "roma-venezia"
    blocks:
      - id: "block-006"
        type: "GALLERY"
        assets:
          - "photo-002"
          - "photo-003"
          - "photo-004"
          - "photo-005"
        caption: "ROMA → VENEZIA — fragments from the journey."

      - id: "block-036"
        type: "TEXT"
        content: |
          列車でヴェネツィアへ。

          着いてすぐに水上バスに乗ると、「水の都」という言葉が、
          景色ではなく感覚になった。

          水の音と、あたたかい空気。都会の喧騒に、おいしいイタリアンの匂いが混じっていた。

          「暑いね」と何度も言いながら、ふたりとも新しい世界に触れることにわくわくしていた。
    layout:
      type: "asymmetric-gallery"
      settings:
        motif: "wave-lines"
        density: "mixed"

  - id: "spread-008-009"
    pages: [8, 9]
    section: "venezia"
    blocks:
      - id: "block-007"
        type: "PHOTO"
        asset: "photo-006"
    layout:
      type: "full-bleed-spread"
      settings:
        image_position: "center 70%"

  - id: "page-010"
    pages: [10]
    section: "italy"
    blocks:
      - id: "block-008"
        type: "PHOTO"
        asset: "bottle-001"
        caption: "ITALY — Aperol Spritz"

      - id: "block-009"
        type: "TEXT"
        content: |
          Aperol Spritz

          Ingredients
          - Aperol
          - Prosecco
          - Soda water
          - Ice
          - Orange slice

          Method
          1. Fill a glass with ice.
          2. Add Aperol.
          3. Add Prosecco.
          4. Top with soda water.
          5. Garnish with an orange slice.

      - id: "block-033"
        type: "PHOTO"
        asset: "glass-001"
    layout:
      type: "recipe-page"
      notes: "Represented with PHOTO + TEXT until a dedicated RECIPE Block exists."

  - id: "page-011"
    pages: [11]
    section: "italy"
    blocks:
      - id: "block-010"
        type: "PHOTO"
        asset: "photo-007"

      - id: "block-011"
        type: "TEXT"
        content: |
          ヴェネツィアを出る日は、まいちゃんのファインプレーで、飛行機に乗り遅れずにすんだ。

          あのとき食べたティラミスは、いろいろな意味で忘れられない味になった。

          ヴェネツィアの素敵なAirbnbで、
          「こんなことを自分もやりたい」と話した。

          「しゅんやの好きなのをやりなよ。形にしていきなよ」

          あの言葉は、今も何かを始めるときに
          思い出す。
    layout:
      type: "image-with-reflection"
      settings:
        motif: "wave-lines"

  - id: "page-012"
    pages: [12]
    section: "munchen-bern"
    blocks:
      - id: "block-012"
        type: "PHOTO"
        asset: "photo-008"
    layout:
      type: "full-page"

  - id: "page-013"
    pages: [13]
    section: "munchen-bern"
    blocks:
      - id: "block-013"
        type: "TEXT"
        content: |
          MÜNCHEN

          ミュンヘンにはヨーロッパらしい空気が残っていた。

          その中に、物事がきちんと整えられているような、几帳面さを感じた。

          BMW博物館では、少し退屈な時間を過ごさせちゃったかもしれない。

          それでも付き合ってくれて、ありがとう。
    layout:
      type: "reflective-notes"
      settings:
        line_structure: "multiple-horizontal-lines"
        handwritten_feel: true

  - id: "page-014"
    pages: [14]
    section: "munchen-bern"
    blocks:
      - id: "block-014"
        type: "PHOTO"
        asset: "detail-001"
    layout:
      type: "full-page"

  - id: "page-015"
    pages: [15]
    section: "munchen-bern"
    blocks:
      - id: "block-017"
        type: "PHOTO"
        asset: "photo-009"

      - id: "block-018"
        type: "TEXT"
        content: |
          BERN

          ベルンは、目に入るものすべてが驚くほどきれいだった。物価の高さにも、同じくらい驚いた。

          一番心に残ったのは、そこにいる人たちだった。

          行き交う人がみんな楽しそうで、自分のために人生を生きているように見えた。

          僕も、そんなふうに生きてみたいと思った。
    layout:
      type: "image-with-short-text"

  - id: "page-016"
    pages: [16]
    section: "amsterdam-paris"
    blocks:
      - id: "block-019"
        type: "PHOTO"
        asset: "photo-010"

      - id: "block-037"
        type: "TEXT"
        content: |
          PARIS

          パリには、とにかく洗練された美しさがあった。

          世界中の人がこの街へ行きたいと思う気持ちが、
          少しわかった。

          思っていたより、みんなずっと親切だった。
          人と人の距離が、どこか日本の田舎みたいだった。

          オニオンスープとワインも、忘れたくない。

          A SMALL MEMORY

          モン・サン＝ミシェルへ向かうバスでは、
          『相席食堂』をたくさん見た。

          テレビっ子じゃない僕に、新しい面白いものを教えてもらった気分だった。
    layout:
      type: "full-page-story"

  - id: "page-017"
    pages: [17]
    section: "amsterdam-paris"
    blocks:
      - id: "block-020"
        type: "PHOTO"
        asset: "photo-011"

      - id: "block-021"
        type: "TEXT"
        content: |
          PALAIS GARNIER

          ガルニエ宮に入ったとき、まいちゃんが本当にうれしそうだった。

          あの日はバレエを観られなかったけれど、次にパリへ行くときは、一緒に観ようね。

          パリには、また行きたいな。今度は、まいちゃんにバレエを
          見せてあげたい。
    layout:
      type: "image-text-offset"

  - id: "spread-018-019"
    pages: [18, 19]
    section: "amsterdam-paris"
    blocks:
      - id: "block-022"
        type: "PHOTO"
        asset: "photo-012"

      - id: "block-038"
        type: "TEXT"
        content: |
          AMSTERDAM

          アムステルダムは、小さな街だった。

          限られたものを無駄にせず、その中でうまく暮らしているように見えた。

          ボートハウスはかわいく、街にはたくさんの色が
          あった。
          天気が良くなくても、不思議と明るく感じた。

          日本と少し似ている気がした。

          小さな場所でうまく生きることは、僕も真似したいと思った。

          フレンチフライも、おいしかった。
    layout:
      type: "full-bleed-story-spread"

  - id: "spread-020-021"
    pages: [20, 21]
    section: "barcelona-madrid"
    blocks:
      - id: "block-023"
        type: "GALLERY"
        assets:
          - "photo-013"
          - "photo-014"
          - "photo-015"
          - "photo-016"
        caption: "BARCELONA → MADRID — collage of travel fragments."
      - id: "block-024"
        type: "TEXT"
        content: |
          旅にも、少しずつ慣れてきた。

          知らない街を歩くことも、予定外の出来事も、少しずつふたりの日常になっていた。

          いろいろな景色を楽しそうに見ているまいちゃんを、よく覚えている。
    layout:
      type: "editorial-collage"

  - id: "page-022"
    pages: [22]
    section: "barcelona-madrid"
    blocks:
      - id: "block-025"
        type: "TEXT"
        content: |
          BARCELONA

          バルセロナは賑やかで、空気まであたたかい街だった。

          建物は、ほかの国では見たことのない形を
          していた。うまく言葉にできないけれど、
          街そのものに独特のリズムがあった。

          サグラダ・ファミリアでは、ステンドグラスを通った光が、教会の中をやわらかく染めていた。

          一番覚えているのは、まいちゃんがオレンジジュースをおつかいに行ってくれたこと。

          パエリアを本当においしそうに食べていたことも、うれしかった。僕は、ししとうの揚げ焼きとマッシュルームの料理が好きだった。

      - id: "block-040"
        type: "TEXT"
        content: |
          MADRID

          マドリードは二度目だった。
          でも、まいちゃんと一緒だと、初めて来た
          街のように新鮮だった。

          国外のクレジットカードでは、レアルのチケットを買えないというハプニング。ドタバタしながら、どうにかチケットを取った。

          ベルナベウの熱気と歓声。
          夢が叶った達成感と高揚感は忘れられない。

          市場で食べたピンチョスと、ワインの
          カクテルもおいしかった。
    layout:
      type: "text-page"
      variant: "lined"

  - id: "page-023"
    pages: [23]
    section: "barcelona-madrid"
    blocks:
      - id: "block-026"
        type: "PHOTO"
        asset: "photo-017"
    layout:
      type: "full-page"

  - id: "spread-024-025"
    pages: [24, 25]
    section: "future"
    blocks:
      - id: "block-027"
        type: "CHECKLIST"
        title: "THINGS I WANT TO DO"
        items:
          - text: "もっといろいろな景色を、ふたりで見る。"
            checked: false
          - text: "まいちゃんがもっとわくわくする世界を、一緒に見つける。"
            checked: false
          - text: "ふたりの共通の趣味を、もっと増やす。"
            checked: false
          - text: "美味しい朝ごはんを作ってあげる。"
            checked: false
          - text: "一緒に早起きして、朝の時間を楽しむ。"
            checked: false
          - text: "ふたりで何かを作る。"
            checked: false
          - text: "素敵な将来を一緒に考えて、一緒に作る。"
            checked: false
    layout:
      type: "spread-checklist"
      settings:
        columns: 2

  - id: "page-026"
    pages: [26]
    section: "lisbon"
    blocks:
